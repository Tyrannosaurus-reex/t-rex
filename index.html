<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#e9aabd"
    >

    <title>Carta</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="cargando">


    <!-- ================================
         PANTALLA DEL NAVEGADOR
    ================================= -->

    <div id="pantallaNavegador">

        <div class="decoracion-navegador">

            <div class="nubecita nav-nube1"></div>

            <div class="nubecita nav-nube2"></div>

            <span>✦</span>
            <span>✧</span>

        </div>


        <div class="mensajeNavegador">
            ola :3
        </div>

    </div>



    <!-- ================================
         PANTALLA PRINCIPAL
    ================================= -->

    <div id="pantallaSobre">


        <!-- NUBES -->

        <div class="nube nube1">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nube nube2">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nube nube3">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nube nube4">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="nube nube5">
            <span></span>
            <span></span>
            <span></span>
        </div>


        <!-- BRILLITOS -->

        <div class="brillo brillo1">✦</div>
        <div class="brillo brillo2">✧</div>
        <div class="brillo brillo3">✦</div>
        <div class="brillo brillo4">✧</div>
        <div class="brillo brillo5">✦</div>
        <div class="brillo brillo6">✧</div>



        <!-- SOBRE -->

        <div id="zonaSobre">

            <div
                class="sobre"
                id="sobre"
            >

                <div class="sombra"></div>


                <div class="papel">

                    <div class="borde-papel"></div>

                </div>


                <div class="sobre-base"></div>


                <div class="doblez izquierda"></div>

                <div class="doblez derecha"></div>


                <div class="tapa"></div>


                <div class="sello">
                    <span>♡</span>
                </div>

            </div>

        </div>



        <!-- CONTADOR -->

        <div id="contador">

            <div class="contador-caja">

                <div class="mini-sello">
                    ✦
                </div>


                <div id="tiempo">

                    <div class="numero">

                        <span id="dias">
                            00
                        </span>

                        <small>
                            días
                        </small>

                    </div>


                    <div class="separador">
                        :
                    </div>


                    <div class="numero">

                        <span id="horas">
                            00
                        </span>

                        <small>
                            horas
                        </small>

                    </div>


                    <div class="separador">
                        :
                    </div>


                    <div class="numero">

                        <span id="minutos">
                            00
                        </span>

                        <small>
                            min
                        </small>

                    </div>


                    <div class="separador">
                        :
                    </div>


                    <div class="numero">

                        <span id="segundos">
                            00
                        </span>

                        <small>
                            seg
                        </small>

                    </div>

                </div>

            </div>

        </div>


    </div>



    <!-- ================================
         PANTALLA DE LA CARTA
    ================================= -->

    <div id="pantallaCarta">


        <!-- DECORACIÓN -->

        <div class="decoracionCarta">

            <span class="estrella e1">
                ✦
            </span>

            <span class="estrella e2">
                ✧
            </span>

            <span class="estrella e3">
                ✦
            </span>

            <span class="estrella e4">
                ✧
            </span>

            <span class="estrella e5">
                ✦
            </span>

            <span class="estrella e6">
                ✧
            </span>

        </div>


        <!-- LUCES DEL FONDO -->

        <div class="luz luz1"></div>
        <div class="luz luz2"></div>
        <div class="luz luz3"></div>


        <!-- CARTA -->

        <div class="carta-marco">

            <div class="carta-brillo"></div>


            <div class="carta-contenedor">

                <img
                    id="imagenCarta"
                    src="carta.png"
                    alt="Carta"
                >

            </div>

        </div>


        <!-- VOLVER -->

        <button id="volver">
            Volver
        </button>


    </div>



    <script src="script.js"></script>

</body>

</html>
