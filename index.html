<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#e9aabd"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>t-rex</title>

</head>


<body class="cargando">


    <!-- =========================
         PANTALLA DE CARGA
    ========================== -->

    <div id="pantallaCarga">

        <div class="carga-nubes">

            <div class="nube-carga nube-carga-1"></div>
            <div class="nube-carga nube-carga-2"></div>
            <div class="nube-carga nube-carga-3"></div>

        </div>


        <div class="carga-contenido">

            <div class="ruedita">
                <div class="rueda"></div>
            </div>

            <div class="texto-cargando">
                cargando...
            </div>

            <div class="barra-carga">

                <div id="progresoCarga"></div>

            </div>

            <div id="porcentajeCarga">
                0%
            </div>

        </div>

    </div>



    <!-- =========================
         PANTALLA "OLA"
    ========================== -->

    <div id="pantallaNavegador">

        <div class="nube-navegador nube-nav-1"></div>
        <div class="nube-navegador nube-nav-2"></div>
        <div class="nube-navegador nube-nav-3"></div>
        <div class="nube-navegador nube-nav-4"></div>


        <div class="mensajeNavegador">

            <div class="texto-ola">
                ola :3
            </div>


            <button id="botonInstalar">
                Descargar
            </button>

        </div>

    </div>



    <!-- =========================
         PANTALLA DEL SOBRE
    ========================== -->

    <div id="pantallaSobre">

        <!-- CD DE LA APP -->

        <div
            id="reproductorMusica"
            class="reproductor-musica oculto"
        >

            <img
                id="imagenCD"
                src="cd1.png"
                alt="CD"
            >

        </div>


        <!-- MÚSICA 1 -->

        <audio
            id="musica1"
            src="musica1.mp3"
            loop
            preload="auto"
        ></audio>


        <!-- MÚSICA 2 -->

        <audio
            id="musica2"
            src="musica2.mp3"
            loop
            preload="auto"
        ></audio>



        <div class="nube nube1"></div>
        <div class="nube nube2"></div>
        <div class="nube nube3"></div>
        <div class="nube nube4"></div>
        <div class="nube nube5"></div>


        <div class="brillo brillo1">✦</div>
        <div class="brillo brillo2">✧</div>
        <div class="brillo brillo3">✦</div>
        <div class="brillo brillo4">✧</div>
        <div class="brillo brillo5">✦</div>
        <div class="brillo brillo6">✧</div>



        <div id="zonaSobre">

            <div
                class="sobre"
                id="sobre"
            >

                <div class="sombra"></div>

                <div class="papel">

                    <div class="borde-papel"></div>

                </div>

                <div class="sobre-base"></div>

                <div class="doblez izquierda"></div>
                <div class="doblez derecha"></div>

                <div class="tapa"></div>

                <div class="sello">
                    <span>♡</span>
                </div>

            </div>

        </div>



        <!-- =========================
             CONTADOR
        ========================== -->

        <div id="contador">

            <div class="contador-caja">

                <div class="mini-sello">
                    ✦
                </div>


                <div id="tiempo">

                    <div class="numero">

                        <span id="dias">
                            00
                        </span>

                        <small>
                            días
                        </small>

                    </div>


                    <div class="separador">
                        :
                    </div>


                    <div class="numero">

                        <span id="horas">
                            00
                        </span>

                        <small>
                            horas
                        </small>

                    </div>


                    <div class="separador">
                        :
                    </div>


                    <div class="numero">

                        <span id="minutos">
                            00
                        </span>

                        <small>
                            min
                        </small>

                    </div>


                    <div class="separador">
                        :
                    </div>


                    <div class="numero">

                        <span id="segundos">
                            00
                        </span>

                        <small>
                            seg
                        </small>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         PANTALLA DE LA CARTA
    ========================== -->

    <div
        id="pantallaCarta"
        class="oculto"
    >

        <div class="decoracionCarta">

            <span class="estrella e1">
                ✦
            </span>

            <span class="estrella e2">
                ✧
            </span>

            <span class="estrella e3">
                ✦
            </span>

            <span class="estrella e4">
                ✧
            </span>

            <span class="estrella e5">
                ✦
            </span>

            <span class="estrella e6">
                ✧
            </span>

        </div>


        <div class="luz luz1"></div>
        <div class="luz luz2"></div>
        <div class="luz luz3"></div>


        <div class="carta-marco">

            <div class="carta-contenedor">

                <img
                    id="imagenCarta"
                    src="carta.png"
                    alt="Carta"
                >


                <div
                    id="mensajeCartaError"
                    class="mensajeCartaError"
                >
                    Todavía no hay una carta disponible.
                </div>

            </div>

        </div>


        <button id="volver">
            Volver
        </button>

    </div>



    <script src="script.js"></script>

</body>

</html>
